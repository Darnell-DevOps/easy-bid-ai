name: Launch checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: launch-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App typecheck, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:launch

  edge-functions:
    name: Critical Edge Function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check launch-critical functions
        run: >-
          deno check
          --node-modules-dir=auto
          --no-lock
          supabase/functions/client-portal-accept/index.ts
          supabase/functions/automation-dispatcher/index.ts
          supabase/functions/contract-generation-retry-cron/index.ts
          supabase/functions/inbound-email-webhook/index.ts
          supabase/functions/form-upload-sign/index.ts
          supabase/functions/form-upload-signed-read/index.ts
          supabase/functions/report-client-error/index.ts
          supabase/functions/create-plan-checkout/index.ts
          supabase/functions/cancel-plan-subscription/index.ts
          supabase/functions/create-proposal-checkout/index.ts
          supabase/functions/generate-proposal/index.ts
          supabase/functions/generate-policy/index.ts
          supabase/functions/lead-response/index.ts
          supabase/functions/payments-webhook/index.ts
          supabase/functions/payment-event-worker/index.ts
          supabase/functions/send-email/index.ts
          supabase/functions/stripe-connect-account/index.ts
      - name: Test Stripe Connect server safeguards
        run: deno test --allow-env supabase/functions/_shared/stripe-connect.test.ts
      - name: Smoke-test the generated MCP Edge Function
        run: |
          deno run --no-lock --allow-env --allow-net=0.0.0.0:8000 supabase/functions/mcp/index.ts &
          mcp_pid=$!
          trap 'kill "$mcp_pid" 2>/dev/null || true' EXIT
          mcp_url=http://127.0.0.1:8000/functions/v1/mcp
          curl --fail --silent --show-error --max-time 5 --retry 30 --retry-connrefused --retry-delay 1 \
            "$mcp_url/.well-known/oauth-protected-resource" | jq -e '.authorization_servers | length == 1'
          status=$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$mcp_url")
          test "$status" = 401

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # v3 installs from npm; a fixed release avoids the unauthenticated
      # GitHub "latest release" lookup that intermittently hit rate limits.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      # This runner has a fresh Docker volume. Startup applies every migration.
      - name: Start disposable Supabase and apply migrations
        run: supabase start
      - name: Check payment and email concurrency in disposable database
        run: node scripts/test-payment-concurrency.mjs
      - name: Check tenant isolation and telemetry in disposable database
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -X -f scripts/test-tenant-isolation.sql
      - name: Check retainer approvals and billing in disposable database
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -X -f scripts/test-retainer-billing-review.sql
      - run: npm ci
      - name: Install browser and PDF inspection tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
      - name: Sign, countersign and verify both executed PDFs
        run: |
          local_stack=$(supabase status -o json)
          api_url=$(jq -er '.API_URL' <<< "$local_stack")
          test "$api_url" = http://127.0.0.1:54321
          anon_key=$(jq -er '.ANON_KEY' <<< "$local_stack")
          service_key=$(jq -er '.SERVICE_ROLE_KEY' <<< "$local_stack")
          email=contract-owner@example.invalid
          password=$(openssl rand -hex 24)
          curl --fail --silent --show-error --output /dev/null \
            -H "apikey: $service_key" -H "Authorization: Bearer $service_key" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password,email_confirm:true}')" \
            "$api_url/auth/v1/admin/users"
          VITE_SUPABASE_URL="$api_url" VITE_SUPABASE_PUBLISHABLE_KEY="$anon_key" \
            TEST_SUPABASE_URL="$api_url" TEST_SUPABASE_PUBLISHABLE_KEY="$anon_key" \
            TEST_USER_EMAIL="$email" TEST_USER_PASSWORD="$password" \
            npm run test:e2e -- tests/contracts/sign-flow.spec.ts --workers=1

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    needs: app
    env:
      E2E_BASE_URL: ${{ github.event_name == 'push' && vars.E2E_BASE_URL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke and accessibility tests
        run: npm run test:e2e
